---
# Cross-cutting variables only. Everything that belongs to a single role lives
# in roles/<role>/defaults/main.yml and can be overridden from here, from the
# inventory or with -e.

# ---------------------------------------------------------------------------
# Operating system helpers (Debian/Ubuntu and RHEL family)
# ---------------------------------------------------------------------------
is_debian: "{{ ansible_facts['os_family'] == 'Debian' }}"
is_rhel: "{{ ansible_facts['os_family'] == 'RedHat' }}"
sudo_group: "{{ 'wheel' if ansible_facts['os_family'] == 'RedHat' else 'sudo' }}"
firewall_backend: "{{ 'firewalld' if ansible_facts['os_family'] == 'RedHat' else 'ufw' }}"

# True only when the play runs INSIDE a container (guest). A bare host that
# merely runs Docker can be reported as virtualization_type=docker with role
# "host"; that must not be treated as a container, otherwise kernel settings
# would be silently skipped on real servers.
is_container: >-
  {{ ansible_facts['virtualization_type'] | default('') in
       ['lxc', 'docker', 'podman', 'containerd', 'systemd-nspawn']
     and ansible_facts['virtualization_role'] | default('') == 'guest' }}

# ---------------------------------------------------------------------------
# Admin user / sudo
# ---------------------------------------------------------------------------
# Default to the account Ansible connects with. This is correct for both local
# and remote runs; the control node's $USER is not used. Override with:
#   ansible-playbook site.yml -e admin_user=alice
admin_user: "{{ ansible_user | default(ansible_user_id | default('root'), true) }}"
# "sudo" on Debian/Ubuntu, "wheel" on the RHEL family.
admin_user_groups:
  - "{{ sudo_group }}"
# A newly created user has a locked password and no SSH key, so it cannot log
# in until one of these is set. Both are optional and only applied to users
# other than root.
#   admin_user_password_hash: generate with  mkpasswd --method=sha-512
#   admin_user_authorized_keys: list of public key lines
admin_user_password_hash: ""
admin_user_authorized_keys: []
# Passwordless sudo is OFF by default: with password SSH login enabled it would
# turn a guessed/leaked login password into root without any second step.
# Enable it only for key-only accounts. NOTE: on remote runs where the
# connecting user relies on NOPASSWD, keep this true or pass -K.
admin_user_sudo_nopasswd: false

# ---------------------------------------------------------------------------
# Firewall: extra ports (used by pre_tasks, firewall role and the summary)
# ---------------------------------------------------------------------------
# Each entry is a mapping. "proto" defaults to tcp, "from" to any source.
# Example:
# firewall_allowed_ports:
#   - port: 80
#     proto: tcp
#   - port: 443
#     proto: tcp
#     from: 10.0.0.0/8
firewall_allowed_ports: []
