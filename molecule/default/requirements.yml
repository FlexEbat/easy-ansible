# Collections required by the playbook itself plus community.docker, which the
# Molecule Docker driver uses to reach the test instances.
collections:
  - name: ansible.posix
    version: ">=1.5.4,<2.0.0"
  - name: community.general
    version: ">=8.0.0,<9.0.0"
  - name: community.docker
    version: ">=3.4.0"
