# Local test target. The playbook is normally executed inside the target
# (for example: lxc exec linux-lab -- bash), so the local connection is used.
[local]
linux-lab ansible_connection=local

# Example for a real remote server. Replace the address/user and remove the
# [local] group above (or use --limit).
#
# [servers]
# prod-01 ansible_host=203.0.113.10 ansible_user=admin
#
# After the first run the SSH port changes. For later runs, add the persisted
# port (see /etc/ansible-ssh-port or /etc/ansible-setup-summary.json):
#
# prod-01 ansible_host=203.0.113.10 ansible_user=admin ansible_port=22911
#
# [all:vars]
# ansible_python_interpreter=/usr/bin/python3
