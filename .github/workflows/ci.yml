---
name: CI

'on':
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core ansible-lint yamllint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

  molecule:
    name: Molecule (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        platform:
          - debian13
          - ubuntu2404
          - rockylinux9
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Molecule and its Docker driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core molecule "molecule-plugins[docker]" docker

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy collection install -r molecule/default/requirements.yml

      - name: Run the Molecule scenario
        run: molecule test -p ${{ matrix.platform }}
