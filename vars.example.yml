---
# Справочник по настройкам. Обычно vars.local.yml создаёт сам ./run.sh
# (вопросы по-русски), этот файл нужен, чтобы посмотреть все варианты или
# заполнить настройки вручную:
#   cp vars.example.yml vars.local.yml
# Запуск:  sudo ./run.sh        (он сам подхватит vars.local.yml)
# vars.local.yml в .gitignore, в репозиторий он не попадёт.
# Раскомментируйте только то, что нужно; остальное остаётся по умолчанию.

# ---------------------------------------------------------------------------
# Общее
# ---------------------------------------------------------------------------
# Адреса, которые CrowdSec никогда не заблокирует (ваш домашний/офисный IP, VPN).
crowdsec_whitelist_ips: []
# Подсети, которые CrowdSec не банит (например, домашняя сеть).
crowdsec_whitelist_cidrs: []
#  - 192.168.1.0/24

# Дополнительные порты. "from" ограничивает источник, "proto" — tcp (по умолчанию) или udp.
firewall_allowed_ports: []
#  - {port: 80}
#  - {port: 443}
#  - {port: 445, proto: tcp, from: 192.168.1.0/24}

# Опубликованные порты Docker по умолчанию только на localhost (Docker обходит UFW).
# docker_default_bind_ip: 127.0.0.1

# ---------------------------------------------------------------------------
# Домашний компьютер
# ---------------------------------------------------------------------------
# IPv6 нужен домашней сети/провайдеру? Не отключайте его:
# disable_ipv6: false

# ---------------------------------------------------------------------------
# Сервер
# ---------------------------------------------------------------------------
# Пользователь для управления сервером (создаётся, если его нет).
# admin_user: admin
# Ключи нового пользователя. Без ключей и пароля учётка будет заблокирована.
# admin_user_authorized_keys:
#   - ssh-ed25519 AAAA... me@laptop
# Пользователь входит только по ключу, пароля у него нет, поэтому sudo без пароля:
# admin_user_sudo_nopasswd: true

# Автоперезагрузка после обновлений ядра (Debian/Ubuntu: в указанное время).
# auto_reboot: true
# auto_reboot_time: "04:00"

# Жёсткая настройка sshd. Включайте ПОСЛЕ проверки входа по ключу.
# ssh_harden: true
# ssh_password_auth: false
# ssh_permit_root_login: "no"

# ---------------------------------------------------------------------------
# SSH: порт и расширенные настройки (всё необязательно)
# ---------------------------------------------------------------------------
# Другой порт SSH; открывается в firewall автоматически (старое правило для
# порта 22 остаётся, пока не включите firewall_close_old_ssh_port).
# ssh_port: 2222
# firewall_close_old_ssh_port: true
# LoginGraceTime, ClientAlive*, MaxSessions, запрет agent forwarding.
# TCP-forwarding остаётся разрешённым: SSH-туннели и прокси работают.
# ssh_harden_extra: true
# Только современные KEX/шифры/MAC (очень старые клиенты не подключатся).
# ssh_modern_crypto: true
# Кому разрешён вход (админ должен быть в списке).
# ssh_allow_users: [alice]

# ---------------------------------------------------------------------------
# Дополнительная защита: всё выключено по умолчанию, включайте по пунктам.
# У каждого пункта свой тег: --tags sudo,auditd
# ---------------------------------------------------------------------------
# harden_sysctl: true            # kptr_restrict, ptrace_scope, protected_*, ...
# harden_sudo: true              # use_pty, отдельный лог, таймаут пароля
# harden_password_policy: true   # libpwquality: 12 символов, 3 класса
# harden_coredumps: true         # без core dump
# harden_kernel_modules: true    # чёрный список dccp, sctp, rds, tipc, cramfs, ...
# harden_banner: true            # баннер при входе + /etc/motd
# harden_cron_at: true           # cron/at только root + админ
# harden_mac: true               # AppArmor / SELinux: включить и обновить
# harden_auditd: true
# harden_lynis: true
# logrotate_enabled: true        # включён по умолчанию
# docker_prune_enabled: true     # еженедельная очистка Docker (volumes не трогает)
# crowdsec_docker_protection: true   # включён по умолчанию: CrowdSec фильтрует и порты Docker

