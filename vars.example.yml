---
# Шаблон своих настроек. Скопируйте и отредактируйте:
#   cp vars.example.yml vars.local.yml
# Запуск:
#   sudo ./run.sh -e admin_user="$USER" -e @vars.local.yml
# vars.local.yml в .gitignore, в репозиторий он не попадёт.
# Раскомментируйте только то, что нужно; остальное остаётся по умолчанию.

# ---------------------------------------------------------------------------
# Общее
# ---------------------------------------------------------------------------
# Адреса, которые CrowdSec никогда не заблокирует (ваш домашний/офисный IP, VPN).
crowdsec_whitelist_ips: []
# Подсети, которые CrowdSec не банит. В inventory.ini для лаборатории задана
# 192.168.1.0/24; здесь она перекрывается вашей сетью (или пустым списком).
crowdsec_whitelist_cidrs: []

# Дополнительные порты. "from" ограничивает источник, "proto" — tcp (по умолчанию) или udp.
firewall_allowed_ports: []
#  - {port: 80}
#  - {port: 443}
#  - {port: 445, proto: tcp, from: 192.168.1.0/24}

# Опубликованные порты Docker по умолчанию только на localhost (Docker обходит UFW).
# docker_default_bind_ip: 127.0.0.1

# ---------------------------------------------------------------------------
# Домашний компьютер
# ---------------------------------------------------------------------------
# IPv6 нужен домашней сети/провайдеру? Не отключайте его:
# disable_ipv6: false

# ---------------------------------------------------------------------------
# Сервер
# ---------------------------------------------------------------------------
# Пользователь для управления сервером (создаётся, если его нет).
# admin_user: admin
# Ключи нового пользователя. Без ключей и пароля учётка будет заблокирована.
# admin_user_authorized_keys:
#   - ssh-ed25519 AAAA... me@laptop
# Пользователь входит только по ключу, пароля у него нет, поэтому sudo без пароля:
# admin_user_sudo_nopasswd: true

# Автоперезагрузка после обновлений ядра (Debian/Ubuntu: в указанное время).
# auto_reboot: true
# auto_reboot_time: "04:00"

# Жёсткая настройка sshd. Включайте ПОСЛЕ проверки входа по ключу.
# ssh_harden: true
# ssh_password_auth: false
# ssh_permit_root_login: "no"
