---
# ---------------------------------------------------------------------------
# Packages
# ---------------------------------------------------------------------------
# Docker and CrowdSec are installed by their own roles because they may need a
# third-party repository (Docker CE on all supported distributions, CrowdSec
# on the RHEL family).
base_packages_common:
  - sudo
  - wget
  - git
  - ca-certificates
  - kmod
  - openssh-server

base_packages_debian:
  - curl
  - openssh-client
  - procps
  - ufw
  - mtr
  - zram-tools
  - unattended-upgrades
  - rsyslog

base_packages_rhel:
  - openssh-clients
  - procps-ng
  - firewalld
  - python3-firewall
  - policycoreutils-python-utils
  - dnf-plugins-core
  - mtr
  - zram-generator
  - dnf-automatic
  # Provides needs-restarting, used for reboot reporting.
  - yum-utils

# ---------------------------------------------------------------------------
# Time synchronisation (chrony). Skipped inside containers: they use the clock
# of the host.
# ---------------------------------------------------------------------------
base_time_sync: true
base_packages_time_sync:
  - chrony
base_time_sync_service: "{{ 'chronyd' if ansible_facts['os_family'] == 'RedHat' else 'chrony' }}"

# ---------------------------------------------------------------------------
# journald: cap the disk space used by the journal. Empty string = do not touch.
# ---------------------------------------------------------------------------
base_journald_max_use: 500M
base_journald_config: /etc/systemd/journald.conf.d/99-ansible.conf

# ---------------------------------------------------------------------------
# Automatic security updates
# ---------------------------------------------------------------------------
# Debian/Ubuntu: unattended-upgrades. RHEL family: dnf-automatic.
auto_updates_enabled: true
# Reboot automatically after updates that need it (kernel, glibc, ...).
# Debian/Ubuntu: at auto_reboot_time. RHEL: dnf-automatic "reboot = when-needed"
# (needs a recent dnf-automatic; older releases ignore the option).
auto_reboot: false
auto_reboot_time: "04:00"
apt_auto_upgrades_config: /etc/apt/apt.conf.d/20auto-upgrades
apt_unattended_reboot_config: /etc/apt/apt.conf.d/52ansible-unattended-upgrades
dnf_automatic_config: /etc/dnf/automatic.conf
dnf_automatic_timer: dnf-automatic.timer

# ---------------------------------------------------------------------------
# trippy (traceroute/ping TUI). The newest upstream release is resolved at run
# time and installed (or upgraded to) on every run: .deb (Debian family) or
# .rpm (RHEL family) on x86_64, tarball on aarch64. When the newest release
# cannot be resolved, or the architecture has no upstream build, the
# distribution package is used if the repositories provide it; otherwise the
# step is skipped (mtr is installed anyway). Set to false to skip it entirely.
# ---------------------------------------------------------------------------
base_install_trippy: true
# "latest" = newest upstream release. Set an exact version (e.g. "0.13.0") only
# if you want to pin it.
trippy_version: "latest"
# Upstream does not publish checksums, so SHA-256 is verified only for versions
# listed in trippy_known_checksums. For any other (newer) release the download
# is taken from the official GitHub release over HTTPS without a checksum.
# Set to false to install only checksum-verified versions.
trippy_allow_unverified: true
trippy_release_base_url: "https://github.com/fujiapple852/trippy/releases"
trippy_known_checksums:
  "0.13.0":
    deb: "sha256:8fe6e4677399ab5b7b2e75925b913b922ffa3785875b04588a8eca8270349007"
    rpm: "sha256:7c845f29d7cc7cc588609949442673b8f4b37b7c0d8142d16305355a48b1b217"
    tarball_x86_64: "sha256:c4245db59d3251df3c3045752d931afbed00b97896adeb93be62bf0bf3933f09"
    tarball_aarch64: "sha256:0afa3fc574066ff0d91d9e81ec0da012822c83bb39f691f52b562f9b6bbdaae3"

# Upgrade every installed package on each run. Turn it off for repeatable
# test runs (new upstream updates would otherwise show up as changes).
base_upgrade_packages: true

