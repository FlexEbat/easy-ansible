---
# ---------------------------------------------------------------------------
# Packages
# ---------------------------------------------------------------------------
# Docker and CrowdSec are installed by their own roles because they may need a
# third-party repository (Docker CE on all supported distributions, CrowdSec
# on the RHEL family).
base_packages_common:
  - sudo
  - wget
  - git
  - ca-certificates
  - kmod
  - openssh-server

base_packages_debian:
  - curl
  - openssh-client
  - procps
  - ufw
  - mtr
  - zram-tools
  - unattended-upgrades
  - rsyslog

base_packages_rhel:
  - openssh-clients
  - procps-ng
  - firewalld
  - python3-firewall
  - policycoreutils-python-utils
  - dnf-plugins-core
  - mtr
  - zram-generator
  - dnf-automatic
  # Provides needs-restarting, used for reboot reporting.
  - yum-utils

# ---------------------------------------------------------------------------
# Time synchronisation (chrony). Skipped inside containers: they use the clock
# of the host.
# ---------------------------------------------------------------------------
base_time_sync: true
base_packages_time_sync:
  - chrony
base_time_sync_service: "{{ 'chronyd' if ansible_facts['os_family'] == 'RedHat' else 'chrony' }}"

# ---------------------------------------------------------------------------
# journald: cap the disk space used by the journal. Empty string = do not touch.
# ---------------------------------------------------------------------------
base_journald_max_use: 500M
base_journald_config: /etc/systemd/journald.conf.d/99-ansible.conf

# ---------------------------------------------------------------------------
# Automatic security updates
# ---------------------------------------------------------------------------
# Debian/Ubuntu: unattended-upgrades. RHEL family: dnf-automatic.
auto_updates_enabled: true
# Reboot automatically after updates that need it (kernel, glibc, ...).
# Debian/Ubuntu: at auto_reboot_time. RHEL: dnf-automatic "reboot = when-needed"
# (needs a recent dnf-automatic; older releases ignore the option).
auto_reboot: false
auto_reboot_time: "04:00"
apt_auto_upgrades_config: /etc/apt/apt.conf.d/20auto-upgrades
apt_unattended_reboot_config: /etc/apt/apt.conf.d/52ansible-unattended-upgrades
dnf_automatic_config: /etc/dnf/automatic.conf
dnf_automatic_timer: dnf-automatic.timer

# ---------------------------------------------------------------------------
# trippy (traceroute/ping TUI): installed from the distribution's package
# manager only (latest packaged version, nothing pinned). If the repositories
# do not provide it, it is skipped and mtr is used. Set to false to skip it.
# ---------------------------------------------------------------------------
base_install_trippy: true
