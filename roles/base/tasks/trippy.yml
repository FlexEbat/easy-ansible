---
# trippy is installed only from the distribution's package manager, so the
# latest packaged version is used and nothing is pinned. When the repository
# does not provide it, the step is skipped (mtr is installed anyway).
- name: Check whether trippy is already installed
  ansible.builtin.command:
    cmd: sh -c 'command -v trippy || command -v trip'
  register: trippy_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check whether the apt repository provides trippy
  ansible.builtin.command:
    cmd: apt-cache show trippy
  register: trippy_apt_available
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - trippy_check.rc != 0
    - is_debian | bool

- name: Check whether the dnf repositories provide trippy
  ansible.builtin.command:
    cmd: dnf -q list --available trippy
  register: trippy_dnf_available
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - trippy_check.rc != 0
    - is_rhel | bool

- name: Decide whether trippy can be installed from the repositories
  ansible.builtin.set_fact:
    trippy_installable: >-
      {{ trippy_check.rc != 0
         and ((is_debian | bool and (trippy_apt_available.rc | default(1)) == 0)
              or (is_rhel | bool and (trippy_dnf_available.rc | default(1)) == 0)) }}

- name: Report that trippy is not available in the repositories
  ansible.builtin.debug:
    msg: >-
      trippy is not provided by the {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }} repositories; skipping it
      (mtr is installed).
  when:
    - trippy_check.rc != 0
    - not (trippy_installable | bool)

- name: Install trippy with apt
  ansible.builtin.apt:
    name: trippy
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive
  when:
    - trippy_installable | bool
    - is_debian | bool

- name: Install trippy with dnf
  ansible.builtin.dnf:
    name: trippy
    state: present
  when:
    - trippy_installable | bool
    - is_rhel | bool
