---
# Installs the newest trippy release and upgrades an older one. The latest tag
# is read from the redirect of <releases>/latest (no API, so no rate limits).
#   deb / rpm   upstream package (x86_64)
#   tarball     upstream binary (aarch64)
#   distro      distribution package (fallback when upstream cannot be used)
#   none        already up to date / nothing to do
- name: Check the installed trippy
  ansible.builtin.command:
    cmd: sh -c 'bin=$(command -v trip || command -v trippy) && "$bin" --version'
  register: trippy_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Resolve the newest upstream trippy release
  ansible.builtin.uri:
    url: "{{ trippy_release_base_url }}/latest"
    method: HEAD
    follow_redirects: none
    status_code: [301, 302]
  register: trippy_latest
  changed_when: false
  failed_when: false
  check_mode: false
  retries: 3
  delay: 3
  until: trippy_latest.status | default(0) in [301, 302]
  when: trippy_version == 'latest'

- name: Work out the target and installed trippy versions
  ansible.builtin.set_fact:
    trippy_tag: >-
      {{ (trippy_latest.location | default('') | regex_replace('^.*/tag/', ''))
         if trippy_version == 'latest' else trippy_version }}
    trippy_installed_version: >-
      {{ (trippy_check.stdout | default('') | regex_search('[0-9]+\.[0-9]+\.[0-9]+')) or '' }}

- name: Validate the target version
  ansible.builtin.set_fact:
    trippy_tag: "{{ trippy_tag if (trippy_tag | regex_replace('^v', '')) is match('^[0-9]+\\.[0-9]+\\.[0-9]+$') else '' }}"
    trippy_target: "{{ (trippy_tag | regex_replace('^v', '')) if (trippy_tag | regex_replace('^v', '')) is match('^[0-9]+\\.[0-9]+\\.[0-9]+$') else '' }}"

- name: Decide how trippy should be installed
  ansible.builtin.set_fact:
    trippy_arch: "{{ 'aarch64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else ansible_facts['architecture'] }}"
    trippy_method: >-
      {{ 'none' if trippy_check.rc == 0 and (trippy_target == '' or trippy_installed_version == ''
                                              or trippy_installed_version is version(trippy_target, '>='))
         else 'deb' if trippy_target != '' and is_debian | bool and ansible_facts['architecture'] == 'x86_64'
         else 'rpm' if trippy_target != '' and is_rhel | bool and ansible_facts['architecture'] == 'x86_64'
         else 'tarball' if trippy_target != '' and ansible_facts['architecture'] in ['aarch64', 'arm64']
         else 'none' if trippy_check.rc == 0
         else 'distro' }}

- name: Check whether the apt repository provides trippy
  ansible.builtin.command:
    cmd: apt-cache show trippy
  register: trippy_apt_available
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - trippy_method == 'distro'
    - is_debian | bool

- name: Check whether the dnf repositories provide trippy
  ansible.builtin.command:
    cmd: dnf -q list --available trippy
  register: trippy_dnf_available
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - trippy_method == 'distro'
    - is_rhel | bool

- name: Look up the SHA-256 of the selected upstream file
  ansible.builtin.set_fact:
    trippy_checksum: >-
      {{ (trippy_known_checksums[trippy_target] | default({}))
           [('tarball_' ~ trippy_arch) if trippy_method == 'tarball' else trippy_method]
         | default('') }}
  when: trippy_method in ['deb', 'rpm', 'tarball']

- name: Skip an unverifiable upstream download
  ansible.builtin.set_fact:
    trippy_method: none
  when:
    - trippy_method in ['deb', 'rpm', 'tarball']
    - trippy_checksum == ''
    - not (trippy_allow_unverified | bool)

- name: Warn about an upstream file without a known SHA-256
  ansible.builtin.debug:
    msg: >-
      trippy {{ trippy_target }} has no checksum in trippy_known_checksums; it is
      downloaded from the official GitHub release over HTTPS without a SHA-256 check.
  when:
    - trippy_method in ['deb', 'rpm', 'tarball']
    - trippy_checksum == ''

- name: Report that trippy cannot be installed
  ansible.builtin.debug:
    msg: >-
      trippy is not installed: the newest upstream release could not be used on
      {{ ansible_facts['architecture'] }} and the distribution repositories do
      not provide it (mtr is installed).
  when:
    - trippy_method == 'distro'
    - (trippy_apt_available.rc | default(1)) != 0
    - (trippy_dnf_available.rc | default(1)) != 0

- name: Install trippy from the distribution repository
  ansible.builtin.apt:
    name: trippy
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive
  when:
    - trippy_method == 'distro'
    - is_debian | bool
    - (trippy_apt_available.rc | default(1)) == 0

- name: Install trippy from the distribution repository (dnf)
  ansible.builtin.dnf:
    name: trippy
    state: present
  when:
    - trippy_method == 'distro'
    - is_rhel | bool
    - (trippy_dnf_available.rc | default(1)) == 0

- name: Install the upstream trippy .deb
  when: trippy_method == 'deb'
  block:
    - name: Download the upstream trippy .deb
      ansible.builtin.get_url:
        url: "{{ trippy_release_base_url }}/download/{{ trippy_tag }}/trippy_x86_64-unknown-linux-gnu_{{ trippy_target }}_amd64.deb"
        dest: "/tmp/trippy_{{ trippy_target }}_amd64.deb"
        checksum: "{{ trippy_checksum }}"
        mode: "0644"

    - name: Install the upstream trippy .deb
      ansible.builtin.apt:
        deb: "/tmp/trippy_{{ trippy_target }}_amd64.deb"
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive
  rescue:
    - name: Report a failed trippy .deb install
      ansible.builtin.debug:
        msg: "Could not install the upstream trippy {{ trippy_target }} .deb; leaving trippy as it is."

# The upstream RPM is not signed, so dnf's package signature check cannot be
# used. Integrity is enforced by the SHA-256 checksum where one is known.
- name: Install the upstream trippy RPM
  when: trippy_method == 'rpm'
  block:
    - name: Download the upstream trippy RPM
      ansible.builtin.get_url:
        url: "{{ trippy_release_base_url }}/download/{{ trippy_tag }}/trippy-{{ trippy_target }}-x86_64.rpm"
        dest: "/tmp/trippy-{{ trippy_target }}-x86_64.rpm"
        checksum: "{{ trippy_checksum }}"
        mode: "0644"

    - name: Install the upstream trippy RPM
      ansible.builtin.dnf:
        name: "/tmp/trippy-{{ trippy_target }}-x86_64.rpm"
        state: present
        disable_gpg_check: true
  rescue:
    - name: Report a failed trippy RPM install
      ansible.builtin.debug:
        msg: "Could not install the upstream trippy {{ trippy_target }} RPM; leaving trippy as it is."

- name: Install the upstream trippy tarball build
  when: trippy_method == 'tarball'
  vars:
    trippy_tarball_name: "trippy-{{ trippy_target }}-{{ trippy_arch }}-unknown-linux-gnu"
  block:
    - name: Download the trippy tarball
      ansible.builtin.get_url:
        url: "{{ trippy_release_base_url }}/download/{{ trippy_tag }}/{{ trippy_tarball_name }}.tar.gz"
        dest: "/tmp/trippy-{{ trippy_target }}.tar.gz"
        checksum: "{{ trippy_checksum }}"
        mode: "0644"

    - name: Ensure the trippy extraction directory exists
      ansible.builtin.file:
        path: "/tmp/trippy-{{ trippy_target }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Extract the trippy tarball
      ansible.builtin.unarchive:
        src: "/tmp/trippy-{{ trippy_target }}.tar.gz"
        dest: "/tmp/trippy-{{ trippy_target }}"
        remote_src: true
        creates: "/tmp/trippy-{{ trippy_target }}/{{ trippy_tarball_name }}/trip"

    - name: Copy the trippy binary into /usr/local/bin
      ansible.builtin.copy:
        src: "/tmp/trippy-{{ trippy_target }}/{{ trippy_tarball_name }}/trip"
        dest: /usr/local/bin/trip
        remote_src: true
        mode: "0755"
  rescue:
    - name: Report a failed trippy tarball install
      ansible.builtin.debug:
        msg: "Could not install the upstream trippy {{ trippy_target }} tarball; leaving trippy as it is."
