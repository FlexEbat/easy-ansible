---
- name: Ensure firewalld is enabled and running
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started
    daemon_reload: true

- name: Determine the default firewalld zone
  ansible.builtin.command:
    cmd: firewall-cmd --get-default-zone
  register: firewalld_default_zone
  changed_when: false
  when: firewalld_zone | length == 0

- name: Use the default firewalld zone when none was configured
  ansible.builtin.set_fact:
    firewalld_zone: "{{ firewalld_default_zone.stdout | trim }}"
  when: firewalld_zone | length == 0

# ---------------------------------------------------------------------------
# Converge the SSH rules. Rich rules for removed source networks must be
# deleted when ssh_allowed_cidrs changes.
# ---------------------------------------------------------------------------
- name: Read the rich rules in the firewalld zone
  ansible.builtin.command:
    cmd: "firewall-cmd --zone={{ firewalld_zone }} --list-rich-rules"
  register: firewalld_rich_rules
  changed_when: false

- name: Identify source-restricted rules for the SSH port
  ansible.builtin.set_fact:
    firewalld_ssh_rich_rules: >-
      {{ firewalld_rich_rules.stdout_lines
         | select('search', 'port port="' ~ ssh_port ~ '"')
         | list }}

- name: Identify stale source-restricted SSH rules
  ansible.builtin.set_fact:
    firewalld_stale_ssh_rules: >-
      {{ firewalld_ssh_rich_rules
         if ssh_allowed_cidrs | length == 0
         else (firewalld_ssh_rich_rules
               | reject('search', 'source address="(' ~ (ssh_allowed_cidrs | map('regex_escape') | join('|')) ~ ')"')
               | list) }}

- name: Remove stale source-restricted SSH rules
  ansible.posix.firewalld:
    rich_rule: "{{ item }}"
    zone: "{{ firewalld_zone }}"
    permanent: true
    immediate: true
    state: disabled
  loop: "{{ firewalld_stale_ssh_rules }}"

- name: Allow SSH on the new random port
  ansible.posix.firewalld:
    port: "{{ ssh_port }}/tcp"
    zone: "{{ firewalld_zone }}"
    permanent: true
    immediate: true
    state: enabled
  when: (ssh_allowed_cidrs | length) == 0

- name: Restrict SSH to the configured source networks
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4" source address="{{ item }}"
      port port="{{ ssh_port }}" protocol="tcp" accept
    zone: "{{ firewalld_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ ssh_allowed_cidrs }}"
  when: (ssh_allowed_cidrs | length) > 0

- name: Close the new SSH port when source restrictions are configured
  ansible.posix.firewalld:
    port: "{{ ssh_port }}/tcp"
    zone: "{{ firewalld_zone }}"
    permanent: true
    immediate: true
    state: disabled
  when: (ssh_allowed_cidrs | length) > 0

- name: Remove the default SSH service from the zone
  ansible.posix.firewalld:
    service: ssh
    zone: "{{ firewalld_zone }}"
    permanent: true
    immediate: true
    state: disabled

- name: Remove any explicit port 22 rule from the zone
  ansible.posix.firewalld:
    port: "22/tcp"
    zone: "{{ firewalld_zone }}"
    permanent: true
    immediate: true
    state: disabled

# ---------------------------------------------------------------------------
# Additional ports (services published by Docker, web servers, ...)
# ---------------------------------------------------------------------------
- name: Allow additional ports from any source
  ansible.posix.firewalld:
    port: "{{ item.port }}/{{ item.proto | default('tcp') }}"
    zone: "{{ firewalld_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_allowed_ports }}"
  when: (item.from | default('any')) == 'any'

- name: Allow additional ports from restricted sources
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4" source address="{{ item.from }}"
      port port="{{ item.port }}" protocol="{{ item.proto | default('tcp') }}" accept
    zone: "{{ firewalld_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_allowed_ports }}"
  when: (item.from | default('any')) != 'any'
