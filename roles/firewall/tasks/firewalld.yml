---
- name: Ensure firewalld is enabled and running
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started
    daemon_reload: true

- name: Determine the default firewalld zone
  ansible.builtin.command:
    cmd: firewall-cmd --get-default-zone
  register: firewalld_default_zone
  changed_when: false
  when: firewalld_zone | length == 0

- name: Use the default firewalld zone when none was configured
  ansible.builtin.set_fact:
    firewalld_zone: "{{ firewalld_default_zone.stdout | trim }}"
  when: firewalld_zone | length == 0

# ---------------------------------------------------------------------------
# SSH stays on its default port; firewalld already ships an "ssh" service
# definition for it. firewalld denies unmatched incoming traffic, so an
# explicit allow is required.
# ---------------------------------------------------------------------------
- name: Allow the SSH service in the zone
  ansible.posix.firewalld:
    service: ssh
    zone: "{{ firewalld_zone }}"
    permanent: true
    immediate: true
    state: enabled

# ---------------------------------------------------------------------------
# Additional ports (services published by Docker, web servers, ...)
# ---------------------------------------------------------------------------
- name: Allow additional ports from any source
  ansible.posix.firewalld:
    port: "{{ item.port }}/{{ item.proto | default('tcp') }}"
    zone: "{{ firewalld_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_allowed_ports }}"
  when: (item.from | default('any')) == 'any'

- name: Allow additional ports from restricted sources
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4" source address="{{ item.from }}"
      port port="{{ item.port }}" protocol="{{ item.proto | default('tcp') }}" accept
    zone: "{{ firewalld_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_allowed_ports }}"
  when: (item.from | default('any')) != 'any'
