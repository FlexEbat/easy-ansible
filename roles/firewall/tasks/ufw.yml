---
- name: Configure the UFW default incoming policy
  community.general.ufw:
    policy: deny
    direction: incoming

- name: Configure the UFW default outgoing policy
  community.general.ufw:
    policy: allow
    direction: outgoing

- name: Configure the UFW default routed policy
  community.general.ufw:
    policy: deny
    direction: routed

- name: Configure UFW logging
  community.general.ufw:
    logging: "{{ ufw_logging }}"

# ---------------------------------------------------------------------------
# SSH. UFW denies all incoming traffic by default, so an explicit rule for the
# SSH port ({{ ssh_port }}) is required; it follows ssh_port automatically.
# "limit" allows it but throttles repeated connection attempts from one address.
# ---------------------------------------------------------------------------
- name: Allow SSH on the configured port
  community.general.ufw:
    rule: "{{ 'limit' if firewall_ssh_rate_limit | bool else 'allow' }}"
    port: "{{ ssh_port }}"
    proto: tcp
    comment: "SSH"

# Switching firewall_ssh_rate_limit must not leave the previous rule behind.
- name: Remove the opposite SSH rule so that only one remains
  community.general.ufw:
    rule: "{{ 'allow' if firewall_ssh_rate_limit | bool else 'limit' }}"
    port: "{{ ssh_port }}"
    proto: tcp
    delete: true

- name: Allow additional ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    from: "{{ item.from | default('any') }}"
    comment: "{{ item.comment | default('Managed by Ansible') }}"
  loop: "{{ firewall_allowed_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
