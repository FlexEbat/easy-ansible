---
- name: Configure the UFW default incoming policy
  community.general.ufw:
    policy: deny
    direction: incoming

- name: Configure the UFW default outgoing policy
  community.general.ufw:
    policy: allow
    direction: outgoing

- name: Configure the UFW default routed policy
  community.general.ufw:
    policy: deny
    direction: routed

- name: Configure UFW logging
  community.general.ufw:
    logging: "{{ ufw_logging }}"

# ---------------------------------------------------------------------------
# SSH stays on its default port. UFW denies all incoming traffic by default,
# so an explicit allow rule for SSH is required.
# ---------------------------------------------------------------------------
- name: Allow SSH on the default port
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: "SSH"

- name: Allow additional ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    from: "{{ item.from | default('any') }}"
    comment: "{{ item.comment | default('Managed by Ansible') }}"
  loop: "{{ firewall_allowed_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
