---
# ---------------------------------------------------------------------------
# Remove conflicting distribution packages
# ---------------------------------------------------------------------------
- name: Gather installed packages
  ansible.builtin.package_facts:
    manager: auto

- name: Remove conflicting Docker packages
  ansible.builtin.apt:
    name: "{{ docker_conflicting_packages_debian | select('in', ansible_facts.packages) | list }}"
    state: absent
    purge: false
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: docker_conflicting_packages_debian | select('in', ansible_facts.packages) | list | length > 0

# ---------------------------------------------------------------------------
# Add Docker's official repository
# ---------------------------------------------------------------------------
- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Determine the Debian/Ubuntu suite name
  ansible.builtin.shell:
    cmd: '. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}"'
    executable: /bin/sh
  register: docker_apt_suite
  changed_when: false

- name: Determine the Debian architecture
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: docker_apt_arch
  changed_when: false

- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker's official GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ docker_repo_distro }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure the Docker apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/{{ docker_repo_distro }}
      Suites: {{ docker_apt_suite.stdout | trim }}
      Components: stable
      Architectures: {{ docker_apt_arch.stdout | trim }}
      Signed-By: /etc/apt/keyrings/docker.asc

# Remove repository files left behind by older installations so apt does not
# read the same repository twice or fail on a missing signature.
- name: Find legacy Docker apt source files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns:
      - docker.list
      - download_docker_com_*.list
    file_type: file
  register: docker_legacy_sources

- name: Remove legacy Docker apt source files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ docker_legacy_sources.files }}"

- name: Install Docker CE
  ansible.builtin.apt:
    name: "{{ docker_ce_packages }}"
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: docker_install
  retries: 3
  delay: 5
  until: docker_install is succeeded
