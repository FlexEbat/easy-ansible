---
- name: Apply the Debian/Ubuntu Docker CE installation
  ansible.builtin.include_tasks: debian.yml
  when: is_debian | bool

- name: Apply the RHEL family Docker CE installation
  ansible.builtin.include_tasks: rhel.yml
  when: is_rhel | bool

# ---------------------------------------------------------------------------
# Daemon configuration: log rotation (json-file never rotates by default) and
# live-restore so containers survive a daemon restart.
# ---------------------------------------------------------------------------
- name: Ensure the Docker configuration directory exists
  ansible.builtin.file:
    path: "{{ docker_daemon_config | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the Docker daemon configuration
  ansible.builtin.template:
    src: daemon.json.j2
    dest: "{{ docker_daemon_config }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Ensure the docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add the admin user to the docker group
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true
  when:
    - docker_add_admin_to_group | bool
    - admin_user != 'root'

- name: Ensure the Docker service is enabled and running
  ansible.builtin.systemd_service:
    name: docker
    enabled: "{{ docker_service_enabled }}"
    state: "{{ 'started' if docker_service_enabled | bool else 'stopped' }}"
    daemon_reload: true

- name: Wait for the Docker daemon
  ansible.builtin.command:
    cmd: docker info
  register: docker_info
  changed_when: false
  retries: 10
  delay: 2
  until: docker_info.rc == 0
  when: docker_service_enabled | bool

- name: Read the Docker version
  ansible.builtin.command:
    cmd: docker --version
  register: docker_version
  changed_when: false
  when: docker_service_enabled | bool

- name: Show the Docker version
  ansible.builtin.debug:
    msg: "{{ docker_version.stdout }}"
  when: docker_service_enabled | bool

- name: Configure the scheduled Docker cleanup
  ansible.builtin.import_tasks: prune.yml
  when: docker_service_enabled | bool
  tags: [docker_prune]
