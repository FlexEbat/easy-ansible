---
# ---------------------------------------------------------------------------
# Remove conflicting distribution packages
# ---------------------------------------------------------------------------
- name: Gather installed packages
  ansible.builtin.package_facts:
    manager: auto

- name: Remove conflicting Docker packages
  ansible.builtin.dnf:
    name: "{{ docker_conflicting_packages_rhel | select('in', ansible_facts.packages) | list }}"
    state: absent
  when: docker_conflicting_packages_rhel | select('in', ansible_facts.packages) | list | length > 0

# ---------------------------------------------------------------------------
# Add Docker's official repository
# ---------------------------------------------------------------------------
# curl is not listed here: RHEL images ship curl-minimal, which conflicts with
# the full curl package. The base role installs curl only when neither exists.
- name: Install Docker repository prerequisites
  ansible.builtin.dnf:
    name:
      - dnf-plugins-core
      - ca-certificates
    state: present

- name: Add the Docker CE repository
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ docker_rhel_repo_flavor }}/docker-ce.repo"
    dest: /etc/yum.repos.d/docker-ce.repo
    owner: root
    group: root
    mode: "0644"

- name: Install Docker CE
  ansible.builtin.dnf:
    name: "{{ docker_ce_packages }}"
    state: present
    update_cache: true
  register: docker_install
  retries: 3
  delay: 5
  until: docker_install is succeeded
