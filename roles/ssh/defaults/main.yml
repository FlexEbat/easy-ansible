---
# Optional sshd hardening. OFF by default: sshd keeps the distribution
# configuration (port 22, password login allowed). When any of the options
# below is used, a drop-in /etc/ssh/sshd_config.d/00-ansible-hardening.conf is
# written (it is read first, so it wins over other drop-ins such as
# cloud-init's).
#
# SSH port. Anything other than 22 is opened in the firewall automatically
# (UFW / firewalld, plus the SELinux port label on the RHEL family). The old
# port-22 rule stays until firewall_close_old_ssh_port=true.
ssh_port: 22
ssh_harden: false
# Set to false for key-only access. The playbook refuses to disable passwords
# unless the admin user already has a non-empty authorized_keys file
# (see admin_user_authorized_keys).
ssh_password_auth: true
# "no", "prohibit-password" (keys only) or "yes".
ssh_permit_root_login: prohibit-password
ssh_max_auth_tries: 4
ssh_x11_forwarding: false
ssh_dropin_file: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
ssh_service: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
# OpenSSH 8.7 renamed ChallengeResponseAuthentication to
# KbdInteractiveAuthentication.
ssh_kbd_interactive_option: >-
  {{ 'KbdInteractiveAuthentication'
     if ansible_facts['os_family'] == 'Debian' or ansible_facts['distribution_major_version'] | int >= 9
     else 'ChallengeResponseAuthentication' }}

# Extra sshd settings, written only together with ssh_harden_extra=true.
# TCP forwarding stays allowed so that SSH tunnels / proxies (-L, -D,
# ProxyJump) keep working; agent forwarding is off unless you need "ssh -A".
ssh_harden_extra: false
ssh_login_grace_time: 30
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 2
ssh_max_sessions: 10
ssh_allow_tcp_forwarding: true
ssh_allow_agent_forwarding: false

# Restrict who may log in over SSH (empty = everybody). With ssh_harden the
# playbook refuses a list that does not contain the admin user.
ssh_allow_users: []
ssh_allow_groups: []

ssh_modern_crypto: false

# Remove weak algorithms from the DEFAULT lists (ssh_modern_crypto=true). A "-"
# in front subtracts from what OpenSSH already offers instead of replacing it,
# so newer defaults such as the post-quantum hybrid KEX (sntrup761x25519,
# mlkem768x25519 in OpenSSH 9.9+) stay available on every OpenSSH version.
# Removed: finite-field Diffie-Hellman (OpenSSH 10 drops it by default too),
# CBC ciphers, SHA-1/MD5/64-bit MACs. Very old clients may no longer connect.
ssh_kex_algorithms: "-diffie-hellman-group*"
ssh_ciphers: "-*-cbc"
ssh_macs: "-*md5*,hmac-sha1,hmac-sha1-etm@openssh.com,umac-64@openssh.com,umac-64-etm@openssh.com"

# Pre-login banner (see harden_banner in the hardening role); empty = none.
ssh_banner_file: "{{ harden_banner_file if harden_banner | bool else '' }}"

# Ubuntu 24.04 starts sshd through ssh.socket, which ignores "Port" in
# sshd_config; a drop-in for the socket carries the port there.
ssh_socket_dropin: /etc/systemd/system/ssh.socket.d/ansible-port.conf
