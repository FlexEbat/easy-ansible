---
- name: Ensure sshd configuration drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Debian ships this Include by default; the RHEL family may not (older
# releases put everything in sshd_config). Add it once, at the top, so the
# hardening drop-in is always read.
- name: Ensure sshd_config includes the drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    regexp: '^Include\s+/etc/ssh/sshd_config\.d/\*\.conf\s*$'
    insertbefore: BOF
    state: present
  notify: Restart ssh

- name: Ensure /run/sshd exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

# Ubuntu 22.10+ (including 24.04) activates sshd through ssh.socket, which
# ignores the Port directive in sshd_config and keeps listening on 22. Stop
# and disable the socket so ssh.service binds the configured port.
- name: Check whether sshd is socket-activated  # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: systemctl list-unit-files ssh.socket
  register: ssh_socket_unit
  changed_when: false
  failed_when: false

- name: Disable the ssh socket activation unit
  ansible.builtin.systemd_service:
    name: ssh.socket
    enabled: false
    state: stopped
    daemon_reload: true
  when:
    - is_debian | bool
    - ssh_socket_unit.rc == 0
    - "'ssh.socket' in ssh_socket_unit.stdout"
  notify: Restart ssh

- name: Check whether the SSH port has already been persisted
  ansible.builtin.stat:
    path: "{{ ssh_port_state_file }}"
  register: ssh_port_state

- name: Read the persisted SSH port
  ansible.builtin.slurp:
    src: "{{ ssh_port_state_file }}"
  register: ssh_port_slurp
  when: ssh_port_state.stat.exists

- name: Reuse the persisted SSH port
  ansible.builtin.set_fact:
    ssh_port: "{{ ssh_port_slurp.content | b64decode | trim | int }}"
  when: ssh_port_state.stat.exists

- name: Generate a random SSH port
  ansible.builtin.set_fact:
    ssh_port: "{{ range(ssh_port_min, ssh_port_max + 1) | random }}"
  when: not ssh_port_state.stat.exists

- name: Persist the SSH port
  ansible.builtin.copy:
    content: "{{ ssh_port }}\n"
    dest: "{{ ssh_port_state_file }}"
    owner: root
    group: root
    mode: "0644"

# On the RHEL family sshd is confined by SELinux and cannot bind to a
# non-standard port until that port is labelled ssh_port_t.
- name: Allow the SSH port in SELinux
  community.general.seport:
    ports: "{{ ssh_port }}"
    proto: tcp
    setype: ssh_port_t
    state: present
  when:
    - is_rhel | bool
    - ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'
  notify: Restart ssh

# ---------------------------------------------------------------------------
# Keyboard-interactive directive name depends on the OpenSSH version:
# ChallengeResponseAuthentication on OpenSSH < 8.7 (RHEL 8), the renamed
# KbdInteractiveAuthentication on newer releases.
# ---------------------------------------------------------------------------
- name: Read the OpenSSH client version
  ansible.builtin.command:
    cmd: ssh -V
  register: ssh_version_cmd
  changed_when: false
  check_mode: false

- name: Determine the keyboard-interactive directive name
  ansible.builtin.set_fact:
    ssh_kbd_directive: >-
      {{ 'KbdInteractiveAuthentication'
         if (((ssh_version_cmd.stderr | default('', true) | string)
              | regex_findall('OpenSSH_([0-9]+\.[0-9]+)') | first) | default('0.0'))
            is version('8.7', '>=')
         else 'ChallengeResponseAuthentication' }}

- name: Build the effective SSH access settings
  ansible.builtin.set_fact:
    ssh_effective_allow_users: "{{ ([admin_user] + ssh_allow_users) | unique }}"

# ---------------------------------------------------------------------------
# Admin keys. Supplied keys are installed first; server-side generation stays
# optional. Password authentication is only disabled after verifying that at
# least one key is actually present.
# ---------------------------------------------------------------------------
- name: Ensure .ssh directory exists for the admin user
  ansible.builtin.file:
    path: "{{ admin_home }}/.ssh"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_primary_gid }}"
    mode: "0700"

- name: Authorize the supplied public keys for the admin user
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ ssh_authorized_keys }}"
  when: ssh_authorized_keys | length > 0

- name: Generate an SSH key pair for the admin user
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -q -t {{ ssh_key_type }} -N '' -C 'ansible@{{ inventory_hostname }}'
      -f '{{ admin_home }}/.ssh/id_{{ ssh_key_type }}'
    creates: "{{ admin_home }}/.ssh/id_{{ ssh_key_type }}"
  become: true
  become_user: "{{ admin_user }}"
  when:
    - ssh_generate_key | bool
    - not ansible_check_mode

- name: Read the generated public key
  ansible.builtin.slurp:
    src: "{{ admin_home }}/.ssh/id_{{ ssh_key_type }}.pub"
  register: ssh_public_key_raw
  when:
    - ssh_generate_key | bool
    - not ansible_check_mode

- name: Authorize the generated key for the admin user
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ ssh_public_key_raw.content | b64decode }}"
    state: present
  when:
    - ssh_generate_key | bool
    - not ansible_check_mode

- name: Check whether the admin user has authorized keys
  ansible.builtin.stat:
    path: "{{ admin_home }}/.ssh/authorized_keys"
  register: ssh_authorized_keys_stat

- name: Require an authorized key before disabling password authentication
  ansible.builtin.assert:
    that:
      - ssh_authorized_keys_stat.stat.exists
      - ssh_authorized_keys_stat.stat.size | int > 0
    fail_msg: >-
      Password authentication is disabled, but {{ admin_user }} has no
      authorized_keys. Pass ssh_authorized_keys with your public key or set
      ssh_generate_key=true.
  when:
    - not ssh_password_authentication | bool
    - not ansible_check_mode

- name: Read the SSH key fingerprint
  ansible.builtin.command:
    cmd: "ssh-keygen -lf {{ admin_home }}/.ssh/id_{{ ssh_key_type }}.pub"
  register: ssh_key_fingerprint
  changed_when: false
  check_mode: false
  when:
    - ssh_generate_key | bool
    - not ansible_check_mode

- name: Render the SSH hardening drop-in
  ansible.builtin.template:
    src: 00-ansible-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart ssh

- name: Find other sshd drop-in files
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d
    patterns: "*.conf"
    excludes:
      - 00-ansible-hardening.conf
    file_type: file
  register: ssh_dropins

- name: Disable conflicting Port directives in other drop-ins
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^\s*Port\s+\d+\s*$'
    replace: '# Port disabled by Ansible (SSH moved to {{ ssh_port }})'
  loop: "{{ ssh_dropins.files }}"
  notify: Restart ssh

- name: Disable conflicting Port directives in the main sshd_config
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: '^\s*Port\s+\d+\s*$'
    replace: '# Port disabled by Ansible (SSH moved to {{ ssh_port }})'
  notify: Restart ssh

- name: Ensure the SSH host keys exist
  ansible.builtin.command:
    cmd: ssh-keygen -A
  changed_when: false

- name: Validate the sshd configuration
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t -f /etc/ssh/sshd_config
  changed_when: false

- name: Ensure the SSH service is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ ssh_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Fetch the generated private key to the control node (optional)
  ansible.builtin.fetch:
    src: "{{ admin_home }}/.ssh/id_{{ ssh_key_type }}"
    dest: "{{ ssh_key_fetch_dir }}/{{ inventory_hostname }}_id_{{ ssh_key_type }}"
    flat: true
  when:
    - ssh_key_fetch | bool
    - ssh_generate_key | bool
    - not ansible_check_mode

- name: Show SSH configuration summary
  ansible.builtin.debug:
    msg:
      - "SSH port:        {{ ssh_port }}"
      - "Admin user:      {{ admin_user }}"
      - "Allowed users:   {{ ssh_effective_allow_users | join(' ') }}"
      - "Password auth:   {{ ssh_password_authentication }}"
      - "Generated key:   {{ ssh_generate_key }}"
      - "Private key:     {{ admin_home }}/.ssh/id_{{ ssh_key_type }}"
      - "Public key:      {{ admin_home }}/.ssh/id_{{ ssh_key_type }}.pub"
      - "Key fingerprint: {{ ssh_key_fingerprint.stdout | default('n/a') | trim }}"
      - "Port is stored in: {{ ssh_port_state_file }}"
