---
- name: Install CrowdSec from the distribution repositories
  ansible.builtin.apt:
    name: "{{ crowdsec_packages_debian }}"
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

# Debian 13 does not install rsyslog by default, so /var/log/auth.log is
# missing and CrowdSec's sshd parser has nothing to read.
- name: Ensure rsyslog is enabled and running
  ansible.builtin.systemd_service:
    name: rsyslog
    enabled: true
    state: started
    daemon_reload: true

- name: Check whether the auth log already exists
  ansible.builtin.stat:
    path: /var/log/auth.log
  register: crowdsec_auth_log

# Only when the file is missing, so a re-run does not add a log line every time.
- name: Write an auth log entry so the file exists
  ansible.builtin.command:
    cmd: logger -p auth.info -t crowdsec-setup "rsyslog auth log initialized"
  changed_when: true
  when: not crowdsec_auth_log.stat.exists

- name: Wait for /var/log/auth.log to appear
  ansible.builtin.wait_for:
    path: /var/log/auth.log
    timeout: 30
