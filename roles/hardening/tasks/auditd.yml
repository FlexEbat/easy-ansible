---
- name: Install and configure auditd
  when:
    - harden_auditd | bool
    - not (is_container | bool)
  block:
    - name: Install the audit daemon
      ansible.builtin.package:
        name: "{{ 'auditd' if is_debian | bool else 'audit' }}"
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Write the audit rules
      ansible.builtin.copy:
        dest: "{{ harden_auditd_rules_file }}"
        owner: root
        group: root
        mode: "0640"
        content: |
          # Managed by Ansible
          -w /etc/passwd -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/gshadow -p wa -k identity
          -w /etc/sudoers -p wa -k sudoers
          -w /etc/sudoers.d/ -p wa -k sudoers
          -w /etc/ssh/sshd_config -p wa -k sshd
          -w /etc/ssh/sshd_config.d/ -p wa -k sshd
          # Commands run as root by a logged-in user (sudo, su)
          -a always,exit -F arch=b64 -S execve -F euid=0 -F auid>=1000 -F auid!=4294967295 -k root_exec
      notify: Reload the audit rules

    - name: Ensure auditd is enabled and running
      ansible.builtin.systemd_service:
        name: auditd
        enabled: true
        state: started
        daemon_reload: true

- name: Remove the audit rules
  ansible.builtin.file:
    path: "{{ harden_auditd_rules_file }}"
    state: absent
  when: not (harden_auditd | bool)
  notify: Reload the audit rules
