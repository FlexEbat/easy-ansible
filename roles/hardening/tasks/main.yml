- name: Login banner
  ansible.builtin.import_tasks: banner.yml
  tags: [hardening, banner]

- name: Cron and at restrictions
  ansible.builtin.import_tasks: cron.yml
  tags: [hardening, cron]

- name: Mandatory access control
  ansible.builtin.import_tasks: mac.yml
  tags: [hardening, mac]

- name: Audit daemon
  ansible.builtin.import_tasks: auditd.yml
  tags: [hardening, auditd]

- name: Lynis
  ansible.builtin.import_tasks: lynis.yml
