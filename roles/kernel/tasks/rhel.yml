---
# ---------------------------------------------------------------------------
# IPv6 in GRUB (RHEL family uses grubby/BLS)
# ---------------------------------------------------------------------------
- name: Check whether grubby is available
  ansible.builtin.stat:
    path: /usr/sbin/grubby
  register: grubby_check

- name: Read the kernel command lines
  ansible.builtin.command:
    cmd: grubby --info=ALL
  register: grubby_info
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - not (is_container | bool)
    - grubby_check.stat.exists

- name: Add the IPv6-disable kernel parameter with grubby
  ansible.builtin.command:
    cmd: grubby --update-kernel=ALL --args="ipv6.disable=1"
  when:
    - disable_ipv6 | bool
    - not (is_container | bool)
    - grubby_check.stat.exists
    - "'ipv6.disable=1' not in (grubby_info.stdout | default(''))"
  changed_when: true

- name: Remove the IPv6-disable kernel parameter with grubby when IPv6 stays enabled
  ansible.builtin.command:
    cmd: grubby --update-kernel=ALL --remove-args="ipv6.disable=1"
  when:
    - not (disable_ipv6 | bool)
    - not (is_container | bool)
    - grubby_check.stat.exists
    - "'ipv6.disable=1' in (grubby_info.stdout | default(''))"
  changed_when: true

# Without grubby the parameter is appended to the existing GRUB_CMDLINE_LINUX
# value; the other arguments (root=, crashkernel=, ...) are preserved.
- name: Fall back to /etc/default/grub when grubby is unavailable
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX=")(?!.*\bipv6\.disable=1\b)(.*)"$'
    line: '\1\2 ipv6.disable=1"'
    backrefs: true
  register: grub_default
  when:
    - disable_ipv6 | bool
    - not (is_container | bool)
    - not grubby_check.stat.exists

- name: Regenerate the GRUB configuration
  ansible.builtin.command:
    cmd: /usr/sbin/grub2-mkconfig -o /boot/grub2/grub.cfg
  when:
    - disable_ipv6 | bool
    - not (is_container | bool)
    - not grubby_check.stat.exists
    - grub_default is changed
  changed_when: true

- name: Explain why the GRUB IPv6 setting was not applied inside a container
  ansible.builtin.debug:
    msg: >-
      IPv6 is disabled through {{ ipv6_sysctl_file }} at runtime, but the kernel
      command line cannot be changed inside {{ ansible_facts['virtualization_type'] }}.
  when:
    - disable_ipv6 | bool
    - is_container | bool

# ---------------------------------------------------------------------------
# zram (zram-generator)
# ---------------------------------------------------------------------------
- name: Render the zram-generator configuration
  ansible.builtin.copy:
    dest: "{{ zram_generator_config }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible
      [zram0]
      zram-size = ram * {{ zram_percent }} / 100
      compression-algorithm = {{ zram_algorithm }}
      swap-priority = {{ zram_priority }}
  register: zram_generator_config_result

- name: Try to load the zram kernel module
  ansible.builtin.command:
    cmd: modprobe zram
  register: zram_modprobe
  changed_when: false
  failed_when: false
  check_mode: false
  when: not (is_container | bool)

- name: Check for a zram device
  ansible.builtin.stat:
    path: /dev/zram0
  register: zram_device

# Containers must not try to manage zram/swap for the host kernel, even when
# the module happens to be visible inside the container.
- name: Remember whether zram is usable on this host
  ansible.builtin.set_fact:
    zram_usable: >-
      {{ not (is_container | bool)
         and ((zram_modprobe.rc | default(1)) == 0
              or zram_device.stat.exists) }}

- name: Reload systemd so zram-generator is picked up
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: zram_usable | bool

- name: Start the zram setup service
  ansible.builtin.systemd_service:
    name: "{{ zram_generator_service }}"
    state: "{{ 'restarted' if zram_generator_config_result is changed else 'started' }}"
  when: zram_usable | bool

- name: Explain why zram was not started
  ansible.builtin.debug:
    msg: >-
      The zram configuration is in {{ zram_generator_config }}, but zram is
      unavailable or cannot be managed inside this
      {{ ansible_facts['virtualization_type'] | default('unknown') }} environment.
  when: not (zram_usable | bool)
