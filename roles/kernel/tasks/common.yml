---
# ---------------------------------------------------------------------------
# BBR
# ---------------------------------------------------------------------------
# Some minimal RHEL images ship without /etc/sysctl.d.
- name: Ensure the sysctl configuration directory exists
  ansible.builtin.file:
    path: "{{ bbr_sysctl_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the BBR sysctl configuration
  ansible.builtin.copy:
    dest: "{{ bbr_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible
      net.core.default_qdisc = fq
      net.ipv4.tcp_congestion_control = bbr

- name: Load the BBR kernel modules
  ansible.builtin.command:
    cmd: "modprobe {{ item }}"
  loop:
    - tcp_bbr
    - sch_fq
  changed_when: false
  failed_when: false
  when: ansible_virtualization_type not in ['lxc', 'docker', 'podman', 'containerd']

- name: Apply the BBR sysctl settings
  ansible.builtin.command:
    cmd: "sysctl -p {{ bbr_sysctl_file }}"
  register: bbr_apply
  changed_when: false
  when: ansible_virtualization_type not in ['lxc', 'docker', 'podman', 'containerd']

- name: Explain why BBR was not applied inside a container
  ansible.builtin.debug:
    msg: >-
      BBR is written to {{ bbr_sysctl_file }}, but applying kernel sysctls is skipped
      inside {{ ansible_virtualization_type }}. Run the playbook on a real host/VM
      (or load tcp_bbr on the host) for it to take effect.
  when: ansible_virtualization_type in ['lxc', 'docker', 'podman', 'containerd']

# ---------------------------------------------------------------------------
# IPv6
# ---------------------------------------------------------------------------
- name: Write the IPv6-disable sysctl configuration
  ansible.builtin.copy:
    dest: "{{ ipv6_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible
      net.ipv6.conf.all.disable_ipv6 = 1
      net.ipv6.conf.default.disable_ipv6 = 1
      net.ipv6.conf.lo.disable_ipv6 = 1

- name: Apply the IPv6 sysctl settings
  ansible.builtin.command:
    cmd: "sysctl -p {{ ipv6_sysctl_file }}"
  register: ipv6_apply
  changed_when: false
  failed_when: false

# ---------------------------------------------------------------------------
# Network hardening. ip_forward is deliberately left untouched: Docker needs
# it enabled.
# ---------------------------------------------------------------------------
- name: Write the sysctl hardening configuration
  ansible.builtin.copy:
    dest: "{{ sysctl_hardening_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible
      # Reverse-path filtering
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1
      # SYN flood protection
      net.ipv4.tcp_syncookies = 1
      net.ipv4.tcp_syn_retries = 2
      net.ipv4.tcp_synack_retries = 2
      net.ipv4.tcp_max_syn_backlog = 4096
      # Do not accept source-routed packets
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.conf.default.accept_source_route = 0
      # Do not accept ICMP redirects
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.secure_redirects = 0
      net.ipv4.conf.default.secure_redirects = 0
      # Do not send ICMP redirects
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      # Log martian packets
      net.ipv4.conf.all.log_martians = 1
      net.ipv4.conf.default.log_martians = 1

- name: Apply the sysctl hardening settings
  ansible.builtin.command:
    cmd: "sysctl -p {{ sysctl_hardening_file }}"
  register: sysctl_hardening_apply
  changed_when: false
  failed_when: false
  when: ansible_virtualization_type not in ['lxc', 'docker', 'podman', 'containerd']

- name: Explain why the sysctl hardening was not applied inside a container
  ansible.builtin.debug:
    msg: >-
      Network hardening is written to {{ sysctl_hardening_file }}, but applying
      kernel sysctls is skipped inside {{ ansible_virtualization_type }}.
  when: ansible_virtualization_type in ['lxc', 'docker', 'podman', 'containerd']
