---
# Some minimal RHEL images ship without /etc/sysctl.d.
- name: Ensure the sysctl configuration directory exists
  ansible.builtin.file:
    path: "{{ bbr_sysctl_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# ---------------------------------------------------------------------------
# BBR
# ---------------------------------------------------------------------------
- name: Load the BBR kernel modules
  ansible.builtin.command:
    cmd: "modprobe {{ item }}"
  loop:
    - tcp_bbr
    - sch_fq
  changed_when: false
  failed_when: false
  when: not (is_container | bool)

- name: Configure BBR
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ bbr_sysctl_file }}"
    sysctl_set: false
    reload: false
    state: present
  loop: "{{ kernel_bbr_sysctl | dict2items }}"
  notify: Apply BBR sysctl

- name: Explain why BBR was not applied inside a container
  ansible.builtin.debug:
    msg: >-
      BBR is written to {{ bbr_sysctl_file }}, but applying kernel sysctls is skipped
      inside {{ ansible_facts['virtualization_type'] }}. Run the playbook on a real host/VM
      (or load tcp_bbr on the host) for it to take effect.
  when: is_container | bool

# ---------------------------------------------------------------------------
# IPv6
# ---------------------------------------------------------------------------
- name: Disable IPv6 through sysctl
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: "{{ ipv6_sysctl_file }}"
    sysctl_set: false
    reload: false
    state: present
  loop:
    - net.ipv6.conf.all.disable_ipv6
    - net.ipv6.conf.default.disable_ipv6
    - net.ipv6.conf.lo.disable_ipv6
  when: disable_ipv6 | bool
  notify: Apply IPv6 sysctl

- name: Remove the IPv6-disable sysctl file when IPv6 stays enabled
  ansible.builtin.file:
    path: "{{ ipv6_sysctl_file }}"
    state: absent
  when: not (disable_ipv6 | bool)

# ---------------------------------------------------------------------------
# Network hardening
# ---------------------------------------------------------------------------
- name: Configure the sysctl hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ sysctl_hardening_file }}"
    sysctl_set: false
    reload: false
    state: present
  loop: "{{ kernel_hardening_sysctl | dict2items }}"
  notify: Apply sysctl hardening

# tcp_syn_retries only shortens OUTGOING connection attempts (about 7 s timeout)
# and is no flood protection. Earlier versions of this playbook wrote it.
- name: Remove sysctl keys that are no longer managed
  ansible.posix.sysctl:
    name: net.ipv4.tcp_syn_retries
    sysctl_file: "{{ sysctl_hardening_file }}"
    sysctl_set: false
    reload: false
    state: absent

- name: Explain why the sysctl hardening was not applied inside a container
  ansible.builtin.debug:
    msg: >-
      Network hardening is written to {{ sysctl_hardening_file }}, but applying
      kernel sysctls is skipped inside {{ ansible_facts['virtualization_type'] }}.
  when: is_container | bool
