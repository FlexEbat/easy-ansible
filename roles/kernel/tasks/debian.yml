---
# ---------------------------------------------------------------------------
# IPv6 in GRUB
# ---------------------------------------------------------------------------
- name: Ensure the GRUB drop-in directory exists
  ansible.builtin.file:
    path: /etc/default/grub.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add the IPv6-disable kernel parameter for GRUB
  ansible.builtin.copy:
    dest: "{{ ipv6_grub_dropin }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible
      GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX ipv6.disable=1"
      GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT ipv6.disable=1"
  register: ipv6_grub_config
  when: disable_ipv6 | bool

- name: Remove the IPv6-disable kernel parameter when IPv6 stays enabled
  ansible.builtin.file:
    path: "{{ ipv6_grub_dropin }}"
    state: absent
  register: ipv6_grub_removed
  when: not (disable_ipv6 | bool)

- name: Check whether update-grub is available
  ansible.builtin.stat:
    path: /usr/sbin/update-grub
  register: update_grub

- name: Regenerate the GRUB configuration
  ansible.builtin.command:
    cmd: /usr/sbin/update-grub
  when:
    - ipv6_grub_config is changed or ipv6_grub_removed is changed
    - update_grub.stat.exists
  changed_when: true

# ---------------------------------------------------------------------------
# zram (zram-tools)
# ---------------------------------------------------------------------------
- name: Render the zram configuration
  ansible.builtin.template:
    src: zramswap.j2
    dest: /etc/default/zramswap
    owner: root
    group: root
    mode: "0644"
  register: zram_config

- name: Try to load the zram kernel module
  ansible.builtin.command:
    cmd: modprobe zram
  register: zram_modprobe
  changed_when: false
  failed_when: false
  check_mode: false
  when: not (is_container | bool)

- name: Check for a zram device
  ansible.builtin.stat:
    path: /dev/zram0
  register: zram_device

# Containers must not try to manage zram/swap for the host kernel, even when
# the module happens to be visible inside the container.
- name: Remember whether zram is usable on this host
  ansible.builtin.set_fact:
    zram_usable: >-
      {{ not (is_container | bool)
         and ((zram_modprobe.rc | default(1)) == 0
              or zram_device.stat.exists) }}

- name: Enable the zramswap service
  ansible.builtin.systemd_service:
    name: zramswap
    enabled: "{{ zram_usable }}"
    daemon_reload: true

# zram is a memory optimisation, not a security feature: a kernel that cannot
# start it (missing compression algorithm, restricted VM) must not abort the run.
- name: Start or restart the zramswap service
  ansible.builtin.systemd_service:
    name: zramswap
    state: "{{ 'restarted' if zram_config is changed else 'started' }}"
  register: zram_start
  ignore_errors: true  # noqa: ignore-errors
  when: zram_usable | bool

- name: Warn when zramswap could not be started
  ansible.builtin.debug:
    msg: >-
      zramswap did not start ({{ zram_start.msg | default('unknown error') | trim }}).
      Check "journalctl -u zramswap"; a different zram_algorithm (for example
      lzo-rle) may be needed on this kernel. The rest of the setup continues.
  when:
    - zram_start is defined
    - zram_start is failed

- name: Keep zramswap stopped when zram is unavailable
  ansible.builtin.systemd_service:
    name: zramswap
    state: stopped
  when: not (zram_usable | bool)

- name: Explain why zram was not started
  ansible.builtin.debug:
    msg: >-
      The zram configuration is in /etc/default/zramswap, but zram is
      unavailable or cannot be managed inside this
      {{ ansible_facts['virtualization_type'] | default('unknown') }} environment. zramswap was left
      disabled.
  when: not (zram_usable | bool)
