---
bbr_sysctl_file: /etc/sysctl.d/99-bbr.conf
sysctl_hardening_file: /etc/sysctl.d/99-hardening.conf
ipv6_sysctl_file: /etc/sysctl.d/99-disable-ipv6.conf
ipv6_grub_dropin: /etc/default/grub.d/99-disable-ipv6.cfg

# ---------------------------------------------------------------------------
# IPv6. true = disable it (sysctl + kernel command line). Switching back to
# false removes the configuration files; IPv6 comes back after a reboot.
# ---------------------------------------------------------------------------
disable_ipv6: true

# ---------------------------------------------------------------------------
# Network/kernel hardening. ip_forward is deliberately left untouched: Docker
# needs it enabled.
# ---------------------------------------------------------------------------
# Reverse-path filtering: 2 = loose (safe with VPNs, Docker and asymmetric
# routing), 1 = strict (breaks those setups), 0 = off.
kernel_rp_filter: 2
# 1 logs packets with impossible source addresses; noisy on public servers.
kernel_log_martians: 0

kernel_bbr_sysctl:
  net.core.default_qdisc: fq
  net.ipv4.tcp_congestion_control: bbr

kernel_hardening_sysctl:
  # Reverse-path filtering
  net.ipv4.conf.all.rp_filter: "{{ kernel_rp_filter }}"
  net.ipv4.conf.default.rp_filter: "{{ kernel_rp_filter }}"
  # SYN flood protection
  net.ipv4.tcp_syncookies: 1
  net.ipv4.tcp_synack_retries: 2
  net.ipv4.tcp_max_syn_backlog: 4096
  # Do not accept source-routed packets
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  # Do not accept ICMP redirects
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  # Do not send ICMP redirects
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  # Ignore broadcast pings (smurf amplification)
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  # Log martian packets (off by default, see kernel_log_martians)
  net.ipv4.conf.all.log_martians: "{{ kernel_log_martians }}"
  net.ipv4.conf.default.log_martians: "{{ kernel_log_martians }}"
  # Do not leak kernel messages to unprivileged users, no core dumps of setuid
  kernel.dmesg_restrict: 1
  fs.suid_dumpable: 0

# ---------------------------------------------------------------------------
# zram
# ---------------------------------------------------------------------------
zram_algorithm: zstd
zram_percent: 25
zram_priority: 100
# RHEL family only: zram-generator configuration.
zram_generator_config: /etc/systemd/zram-generator.conf
zram_generator_service: systemd-zram-setup@zram0.service
